name: seite

# Einstiegsseite (Menü) und alle Prototypen als GitHub Pages veröffentlichen (Quelle: GitHub Actions).
# Projekteigener Workflow: baut _site mit tools/seite_bauen.py (statt pages.yml des Blueprints, der nur einen Ordner
# veröffentlicht). Einmalig nötig: Settings → Pages → Build and deployment → Source «GitHub Actions».
on:
  push:
    branches: [main]
    paths: ['prototypen/**', 'seite/**', 'tools/seite_bauen.py', '.github/workflows/seite.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Icons aus EduKSX-UI (einzige Quelle des Icon-Sets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MarkusKeller8200/EduKSX-UI
          path: _eduksx-ui
          sparse-checkout: icons/svg
          persist-credentials: false
      - name: Prüfen
        run: python3 tools/pruefen.py
      - name: Seite bauen
        run: python3 tools/seite_bauen.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # Bereitstellen mit einer Wiederholung: «No artifacts named github-pages» tritt zeitweise auf, obwohl das Paket
      # hochgeladen ist (Verzögerung der Artefakt-API). Zweiter Versuch nach 60 s.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Warten vor zweitem Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
