components:
  securitySchemes:
    ident:
      type: oauth2
      description: Anmeldung über EduKSX-Ident (OpenID Connect).
      flows:
        authorizationCode:
          authorizationUrl: https://ident.eduksx.ch/oauth2/authorize
          tokenUrl: https://ident.eduksx.ch/oauth2/token
          scopes:
            codex:lesen: Rechtssammlungen lesen (öffentlich)
            codex:redaktion: Eigene Rechtssammlung pflegen (Schulverwaltung/Gemeindeschreiber:in des Mandanten)
            codex:zentral: 'Gemeinsamer Bestand: Bundes-/Kantonsrecht, Hierarchien, Pflichtkatalog, Gemeindeverzeichnis (Redaktion
              EduKSX-Codex)'
            codex:evaluation: 'Evaluation: Analysen, Leitfaden-Prüfung, Matrix'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Seite:
      name: seite
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Anzahl:
      name: anzahl
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag des gelesenen Stands (optimistisches Sperren).
      schema:
        type: string
    Mandant:
      name: EduKSX-Mandant
      in: header
      required: false
      description: Nur für Personen mit mehreren Mandanten; sonst aus dem Token.
      schema:
        type: string
        format: uuid
  responses:
    Ungueltig:
      description: Eingabe ungültig oder Prüfregel verletzt.
      content: &id011
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NichtAngemeldet:
      description: Kein oder ungültiges Token.
      content: *id011
    KeinRecht:
      description: Rolle oder Scope reicht nicht.
      content: *id011
    NichtGefunden:
      description: Nicht vorhanden oder nicht im Mandanten.
      content: *id011
    Konflikt:
      description: Fachlicher Konflikt (z. B. Zustand erlaubt die Aktion nicht).
      content: *id011
    VersionVeraltet:
      description: If-Match passt nicht zum aktuellen Stand.
      content: *id011
  schemas:
    Problem:
      type: object
      description: Fehler nach RFC 9457 (application/problem+json).
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        fehler:
          type: array
          description: Verletzte Prüfregeln bzw. ungültige Felder.
          items:
            type: object
            properties:
              feld:
                type: string
              regel:
                type: string
              text:
                type: string
      required:
      - title
      - status
    Protokoll:
      type: object
      description: Protokollfelder jedes Datensatzes (nur lesbar).
      properties:
        erstelltAm:
          type: string
          format: date-time
          readOnly: true
        erstelltVon:
          type:
          - string
          - 'null'
          readOnly: true
        geaendertAm:
          type: string
          format: date-time
          readOnly: true
        geaendertVon:
          type:
          - string
          - 'null'
          readOnly: true
        version:
          type: integer
          readOnly: true
    Gemeinde:
      type: object
      description: Politische Gemeinde.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bfsNr:
          type:
          - integer
          - 'null'
        name:
          type: string
        bezirk:
          type: string
        typ:
          type: string
        einheitsgemeinde:
          type:
          - boolean
          - 'null'
        einheitSicher:
          type: boolean
        website:
          type:
          - string
          - 'null'
          format: uri
        rechtssammlungUrl:
          type:
          - string
          - 'null'
          format: uri
        erfassung:
          type: string
          enum:
          - offen
          - erfasst
          - geprueft
        schultraeger:
          type: object
          additionalProperties: true
          description: '{primar, sek}'
        organisation:
          type:
          - string
          - 'null'
          description: Schlüssel der erfassten Organisation
          readOnly: true
      required:
      - name
      - bezirk
    Schulgemeinde:
      type: object
      description: Schulgemeinde.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        typ:
          type: string
          enum:
          - Volksschulgemeinde
          - Primarschulgemeinde
          - Sekundarschulgemeinde
          - Zweckverband
        name:
          type: string
        kurz:
          type:
          - string
          - 'null'
        bezirk:
          type: string
        sitz:
          type:
          - string
          - 'null'
        mitglieder:
          type: array
          items:
            type: string
        mitgliederSicher:
          type: boolean
        organisation:
          type:
          - string
          - 'null'
          readOnly: true
      required:
