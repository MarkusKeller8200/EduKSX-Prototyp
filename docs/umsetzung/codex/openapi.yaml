# EduKSX-Codex – API-Beschreibung (OpenAPI 3.1)
# Stand 2026-11-20 · Status ENTWURF · Grundlage: Prototyp prototypen/rechtssammlung
# Konventionen: docs/umsetzung/README.md · Pfade ohne Modulpräfix (Namensraum beim Zusammenführen)
openapi: 3.1.0
info:
  title: EduKSX-Codex
  version: 0.1.0
  description: 'Systematische Rechtssammlung: Rechtssammlungen der Gemeinden und Schulgemeinden (Rubrik › Erlass › Fassung),
    Bundes- und Kantonsrecht mit Fassungen und Textfassung, Rechtsgrundlagen für Schulen, Normenhierarchien, Pflichtkatalog,
    Vergleichsmatrix und Leitfaden-Prüfung. Öffentliche Erlasse sind ohne Anmeldung lesbar (Scope `codex:lesen` ist für die
    öffentliche Ansicht anonym gewährt).'
  contact:
    name: EduKSX
    url: https://github.com/MarkusKeller8200/EduKSX-Prototyp
  license:
    name: siehe Repository
    identifier: LicenseRef-EduKSX
servers:
- url: https://{mandant}.eduksx.ch/api
  variables:
    mandant:
      default: demo
  description: Beispiel – Namensraum je Modul setzt das Zusammenführen in EduKSX-Architektur.
security:
- ident:
  - codex:lesen
tags:
- name: Verzeichnis
  description: Bezirke, Gemeinden, Schulgemeinden
- name: Sammlungen
  description: Organisationen und Rubriken
- name: Erlasse
  description: Erlasse und Fassungen
- name: Suche
  description: Volltext- und Verweissuche
- name: Rechtsgrundlagen
  description: Rechtsgrundlagen für Schulen und Quellen
- name: Hierarchien
  description: Normenhierarchien
- name: Pflichtkatalog
  description: Pflichtdokumente und Vergleichsmatrix
- name: Evaluation
  description: Analysen und Leitfaden-Prüfung
- name: Einbettung
  description: Widget für Websites
paths:
  /v1/gemeinden:
    get:
      tags:
      - Verzeichnis
      operationId: gemeindeListe
      summary: Gemeinden auflisten
      security:
      - ident:
        - codex:lesen
      parameters:
      - $ref: '#/components/parameters/Seite'
      - $ref: '#/components/parameters/Anzahl'
      - name: bezirk
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: erfassung
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: suche
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Liste der Gemeinden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  daten:
                    type: array
                    items:
                      $ref: '#/components/schemas/GemeindeVoll'
                  seite:
                    type: integer
                  anzahl:
                    type: integer
                  total:
                    type: integer
                required:
                - daten
                - seite
                - anzahl
                - total
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
    post:
      tags:
      - Verzeichnis
      operationId: gemeindeAnlegen
      summary: Gemeinde anlegen
      security:
      - ident:
        - codex:zentral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Gemeinde'
      responses:
        '201':
          description: Angelegt.
          headers:
            ETag: &id001
              description: Version des Datensatzes.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema: &id002
                allOf:
                - $ref: '#/components/schemas/Gemeinde'
                - $ref: '#/components/schemas/Protokoll'
        '400':
          $ref: '#/components/responses/Ungueltig'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '409':
          $ref: '#/components/responses/Konflikt'
  /v1/gemeinden/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Verzeichnis
      operationId: gemeindeLesen
      summary: Gemeinde lesen
      security:
      - ident:
        - codex:lesen
      responses:
        '200':
          description: Gemeinde
          headers: &id003
            ETag: *id001
          content:
            application/json:
              schema: *id002
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '404':
          $ref: '#/components/responses/NichtGefunden'
    patch:
      tags:
      - Verzeichnis
      operationId: gemeindeAendern
      summary: Gemeinde ändern (JSON Merge Patch)
      security:
      - ident:
        - codex:zentral
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Gemeinde'
      responses:
        '200':
          description: Geändert.
