        '400':
          $ref: '#/components/responses/Ungueltig'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
  /v1/kalender/ereignisse/{id}/vorkommen/{datum}/starten:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: datum
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Kalender
      operationId: vorkommenStarten
      summary: Verknüpften Ablauf aus einem Vorkommen starten
      security:
      - ident:
        - flow:bearbeiten
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Startwerte.
              properties:
                kontext:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Ergebnis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lauf'
        '400':
          $ref: '#/components/responses/Ungueltig'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
  /v1/kalender/bereiche:
    get:
      tags:
      - Kalender
      operationId: bereicheListe
      summary: Themenbereiche des Kalenders
      security:
      - ident:
        - flow:lesen
      responses:
        '200':
          description: Liste.
          content:
            application/json:
              schema:
                type: object
                properties:
                  daten:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kalenderbereich'
                  seite:
                    type: integer
                  anzahl:
                    type: integer
                  total:
                    type: integer
                required:
                - daten
                - seite
                - anzahl
                - total
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
  /v1/kalender/export.ics:
    get:
      tags:
      - Kalender
      operationId: kalenderIcs
      summary: Kalender als iCalendar (Abo-Link je Rolle)
      security:
      - ident:
        - flow:lesen
      parameters:
      - name: rolle
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: bereich
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Datei.
          content:
            text/calendar:
              schema:
                type: string
                contentMediaType: text/calendar
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
components:
  securitySchemes:
    ident:
      type: oauth2
      description: Anmeldung über EduKSX-Ident (OpenID Connect).
      flows:
        authorizationCode:
          authorizationUrl: https://ident.eduksx.ch/oauth2/authorize
          tokenUrl: https://ident.eduksx.ch/oauth2/token
          scopes:
            flow:lesen: Abläufe, Aufgaben und Kalender lesen
            flow:bearbeiten: Abläufe starten, Aufgaben erledigen, Kalendereinträge pflegen
            flow:vorlagen: Ablaufvorlagen bearbeiten und freigeben (Schulverwaltung bereitet vor, Ressortvorstand gibt frei)
            flow:register: Vorgangsregister pflegen (Module melden ihre Vorgänge)
            flow:admin: Rollen, Funktionendiagramm, Quellen
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Seite:
      name: seite
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Anzahl:
      name: anzahl
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag des gelesenen Stands (optimistisches Sperren).
      schema:
        type: string
    Mandant:
      name: EduKSX-Mandant
      in: header
      required: false
      description: Nur für Personen mit mehreren Mandanten; sonst aus dem Token.
      schema:
        type: string
        format: uuid
  responses:
    Ungueltig:
      description: Eingabe ungültig oder Prüfregel verletzt.
      content: &id009
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NichtAngemeldet:
      description: Kein oder ungültiges Token.
      content: *id009
    KeinRecht:
      description: Rolle oder Scope reicht nicht.
      content: *id009
    NichtGefunden:
      description: Nicht vorhanden oder nicht im Mandanten.
      content: *id009
    Konflikt:
      description: Fachlicher Konflikt (z. B. Zustand erlaubt die Aktion nicht).
      content: *id009
    VersionVeraltet:
      description: If-Match passt nicht zum aktuellen Stand.
      content: *id009
  schemas:
    Problem:
      type: object
      description: Fehler nach RFC 9457 (application/problem+json).
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        fehler:
          type: array
          description: Verletzte Prüfregeln bzw. ungültige Felder.
          items:
            type: object
            properties:
              feld:
                type: string
              regel:
                type: string
              text:
                type: string
      required:
      - title
      - status
    Protokoll:
      type: object
      description: Protokollfelder jedes Datensatzes (nur lesbar).
      properties:
        erstelltAm:
          type: string
          format: date-time
          readOnly: true
        erstelltVon:
          type:
          - string
          - 'null'
          readOnly: true
        geaendertAm:
          type: string
          format: date-time
          readOnly: true
        geaendertVon:
          type:
          - string
          - 'null'
          readOnly: true
        version:
          type: integer
          readOnly: true
    Rolle:
      type: object
      description: Rolle in Abläufen oder im Kalender.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kurz:
          type: string
        name:
          type: string
        bereich:
          type: string
          enum:
          - ablauf
          - kalender
          - beide
        kalenderrollen:
          type: array
          items:
            type: string
      required:
      - kurz
      - name
    Funktion:
      type: object
      description: Aufgabe im Funktionendiagramm.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nr:
          type: string
        titel:
          type: string
        rollen:
          type: object
          additionalProperties: true
          description: Kompetenz je Rolle, z. B. {"SPF":"E","SV":"V"}
      required:
      - nr
      - titel
    Quelle:
      type: object
      description: Quelle (Gesetz, Merkblatt, Prozessliste).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kurz:
          type: string
        titel:
          type: string
        url:
          type:
          - string
          - 'null'
          format: uri
        codexRef:
          type:
          - string
          - 'null'
      required:
      - kurz
      - titel
    Modul:
      type: object
      description: Modul im Vorgangsregister.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schluessel:
          type: string
        name:
          type: string
        aufgabe:
          type:
          - string
          - 'null'
        endpunkt:
          type:
          - string
          - 'null'
          format: uri
        erreichbar:
          type: boolean
          readOnly: true
        geprueftAm:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        vorgaenge:
          type: array
          items:
            $ref: '#/components/schemas/Vorgang'
      required:
      - schluessel
      - name
    Vorgang:
      type: object
      description: Vorgang, den ein Modul anbietet.
      properties:
        schluessel:
          type: string
        titel:
          type: string
        parameter:
          type: array
          items:
            type: string
        ergebnis:
          type: array
          items:
            type: string
        art:
          type: string
          enum:
          - sofort
          - rueckmeldung
        aktiv:
          type: boolean
      required:
      - schluessel
      - titel
    Vorlage:
      type: object
      description: Ablaufvorlage (versioniert).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
        version:
          type: integer
          readOnly: true
        titel:
          type: string
        gruppe:
          type: string
        status:
          type: string
          enum:
          - entwurf
          - freigegeben
          - archiviert
          readOnly: true
        stichtagName:
          type: string
        beschreibung:
          type:
          - string
          - 'null'
        felder:
          type: array
          items:
            $ref: '#/components/schemas/Feld'
        schritte:
          type: array
          items:
            $ref: '#/components/schemas/VorlageSchritt'
        freigegebenAm:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        warnungen:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - code
      - titel
      - stichtagName
    Feld:
      type: object
      description: Eingabefeld beim Start.
      properties:
        schluessel:
          type: string
        label:
          type: string
        typ:
          type: string
          enum:
          - text
          - zahl
          - datum
          - auswahl
          - person
        optionen:
          type: array
          items:
            type: string
        pflicht:
          type: boolean
      required:
      - schluessel
      - label
      - typ
    VorlageSchritt:
      type: object
      description: Schritt einer Vorlage.
      properties:
        code:
          type: string
        titel:
          type: string
        rolle:
          type: string
        tage:
          type: integer
          description: Frist relativ zum Stichtag
        nach:
          type: array
          items:
            type: string
          description: Codes der Vorgänger
        vorgang:
          type:
          - string
          - 'null'
        parameter:
          type: object
          additionalProperties: true
          description: mit Platzhaltern {feld} bzw. {schritt.ergebnis}
        automatisch:
          type: boolean
        informiert:
          type: array
          items:
            type: string
        bedingung:
          oneOf:
          - $ref: '#/components/schemas/Bedingung'
          - type: 'null'
        funktionNr:
          type:
          - string
          - 'null'
        quelle:
          type: string
        quelleStelle:
          type:
          - string
          - 'null'
      required:
      - code
      - titel
      - rolle
      - tage
      - quelle
    Bedingung:
      type: object
      description: Schritt nur ausführen, wenn die Bedingung zutrifft.
      properties:
        feld:
          type: string
        op:
          type: string
          enum:
          - gleich
          - ungleich
          - in
          - nicht_in
          - groesser
          - kleiner
        wert:
          type: string
      required:
      - feld
      - op
      - wert
    Lauf:
      type: object
      description: Laufender Ablauf.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nummer:
          type: string
          readOnly: true
        vorlage:
          type: string
          readOnly: true
        vorlageVersion:
          type: integer
          readOnly: true
        titel:
          type: string
          readOnly: true
        stichtagName:
          type: string
          readOnly: true
        stichtag:
          type: string
          format: date
          readOnly: true
        kontext:
          type: object
          additionalProperties: true
          readOnly: true
        personId:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        status:
          type: string
          enum:
          - laeuft
          - abgeschlossen
          - abgebrochen
          readOnly: true
        gestartetAm:
          type: string
          format: date
          readOnly: true
        abgeschlossenAm:
          type:
          - string
          - 'null'
          format: date
          readOnly: true
        ausloeser:
          type:
          - string
          - 'null'
          readOnly: true
        fortschritt:
          $ref: '#/components/schemas/Fortschritt'
          description: berechnet
        schritte:
          type: array
          items:
            $ref: '#/components/schemas/LaufSchritt'
    Fortschritt:
      type: object
      description: Fortschritt eines Ablaufs.
      properties:
        erledigt:
          type: integer
        total:
          type: integer
        ueberfaellig:
          type: integer
        naechsterSchritt:
          type:
          - string
          - 'null'
        naechsteFrist:
          type:
          - string
          - 'null'
          format: date
    LaufSchritt:
      type: object
      description: Schritt eines laufenden Ablaufs.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        titel:
          type: string
        rolle:
          type: string
        zustaendigId:
          type:
          - string
          - 'null'
          format: uuid
        frist:
          type: string
          format: date
        vorgaenger:
          type: array
          items:
            type: string
          readOnly: true
        vorgang:
          type:
          - string
          - 'null'
          readOnly: true
        parameter:
          type:
          - object
          - 'null'
          additionalProperties: true
          readOnly: true
        automatisch:
          type: boolean
          readOnly: true
        funktionNr:
          type:
          - string
          - 'null'
          readOnly: true
        quelle:
          type: string
          readOnly: true
        status:
          type: string
          enum:
          - wartet
          - bereit
          - geplant
          - laeuft
          - erledigt
          - uebersprungen
          - fehler
          readOnly: true
        ergebnis:
          type:
          - object
          - 'null'
          additionalProperties: true
          readOnly: true
        erledigtAm:
          type:
          - string
          - 'null'
          format: date
          readOnly: true
        bemerkung:
          type:
          - string
          - 'null'
        ueberfaellig:
          type: boolean
          readOnly: true
    LaufStart:
      type: object
      description: Ablauf aus einer Vorlage starten.
      properties:
        vorlage:
          type: string
          description: Code der Vorlage (freigegebene Version)
        stichtag:
          type: string
          format: date
        kontext:
          type: object
          additionalProperties: true
          description: Werte der Startfelder
        personId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - vorlage
      - stichtag
      - kontext
    Vorschau:
      type: object
      description: 'Vorschau eines Starts: Schritte mit Fristen, weggelassene Schritte, Warnungen.'
      properties:
        schritte:
          type: array
          items:
            $ref: '#/components/schemas/LaufSchritt'
        weggelassen:
          type: array
          items:
            type: string
        warnungen:
          type: array
          items:
            type: string
    Aufgabe:
      type: object
      description: Aufgabe = bereiter oder fehlgeschlagener Schritt für eine Rolle.
      properties:
        laufId:
          type: string
          format: uuid
        laufNummer:
          type: string
        laufTitel:
          type: string
        person:
          type:
          - string
          - 'null'
        schritt:
          $ref: '#/components/schemas/LaufSchritt'
        rolle:
          type: string
        frist:
          type: string
          format: date
        ueberfaellig:
          type: boolean
    Erledigen:
      type: object
      description: Schritt erledigen.
      properties:
        ergebnis:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Ergebnis bei manuellen Schritten
        bemerkung:
          type:
          - string
          - 'null'
    Aufruf:
      type: object
      description: Eintrag im Aufrufprotokoll.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nummer:
          type: string
        zeit:
          type: string
          format: date-time
        laufId:
          type: string
          format: uuid
        schritt:
          type: string
        titel:
          type: string
        person:
          type:
          - string
          - 'null'
        vorgang:
          type: string
        parameter:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - ok
          - fehler
          - ausstehend
          - wiederholt
        antwort:
          type:
          - object
          - 'null'
          additionalProperties: true
        dauerMs:
          type:
          - integer
          - 'null'
    Hinweis:
      type: object
      description: Hinweis an eine Rolle.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rolle:
          type: string
        datum:
          type: string
          format: date
        laufId:
          type:
          - string
          - 'null'
          format: uuid
        text:
          type: string
        gelesen:
          type: boolean
    Rueckmeldung:
      type: object
      description: Rückmeldung eines Moduls zu einem Vorgang der Art «rueckmeldung» (z. B. Unterschrift eingegangen).
      properties:
        aufrufId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ok
          - fehler
        ergebnis:
          type:
          - object
          - 'null'
          additionalProperties: true
        meldung:
          type:
          - string
          - 'null'
      required:
      - aufrufId
      - status
    Ereignis:
      type: object
      description: Ereignis im Jahreskalender.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
        titel:
          type: string
        bereich:
          type:
          - string
          - 'null'
        zeit:
          $ref: '#/components/schemas/Zeitregel'
        nurJahr:
          type:
          - integer
          - 'null'
        ferienregel:
          type:
          - string
          - 'null'
          enum:
          - vorher
          - nachher
          - auslassen
        rollen:
          type: object
          additionalProperties: true
          description: Beteiligung je Kalenderrolle
        teile:
          type: array
          items:
            type: string
        quelle:
          type:
          - string
          - 'null'
        vorlage:
          type:
          - string
          - 'null'
          description: verknüpfte Ablaufvorlage
        notiz:
          type:
          - string
          - 'null'
        regelText:
          type: string
          description: Zeitregel als Satz
          readOnly: true
      required:
      - code
      - titel
      - zeit
    Zeitregel:
      type: object
      description: Zeitregel eines Ereignisses (Aufbau siehe datenbank.sql, flow.kalender_ereignis.zeit).
      properties:
        regel:
          type:
          - string
          - 'null'
          enum:
          - stichtag
          - trimester
          - semester
          - quartal
          - monatlich
          - woechentlich
          - taeglich
          - wochentage
          - wochenende
          - arbeitstage
          - schultage
        q:
          type:
          - integer
          - 'null'
        kw:
          type:
          - integer
          - 'null'
        am:
          type:
          - string
          - 'null'
          description: MM-TT
        von:
          type:
          - string
          - 'null'
          description: MM-TT
        bis:
          type:
          - string
          - 'null'
          description: MM-TT
        anker:
          type:
          - string
          - 'null'
        versatz:
          type:
          - integer
          - 'null'
        einheit:
          type:
          - string
          - 'null'
          enum:
          - tage
          - wochen
          - monate
        bezug:
          type:
          - string
          - 'null'
          enum:
          - beginn
          - ende
          - ganz
        tag:
          type:
          - string
          - 'null'
          description: Tag im Monat oder «letzter»
        wochentag:
          type:
          - integer
          - 'null'
    Vorkommen:
      type: object
      description: Berechnetes Vorkommen eines Ereignisses.
      properties:
        ereignisId:
          type: string
          format: uuid
        titel:
          type: string
        bereich:
          type:
          - string
          - 'null'
        von:
          type: string
          format: date
        bis:
          type: string
          format: date
        info:
          type: string
          description: z. B. «verschoben von …»
        erledigt:
          type: boolean
        teileErledigt:
          type: array
          items:
            type: integer
        vorlage:
          type:
          - string
          - 'null'
        laufId:
          type:
          - string
          - 'null'
          format: uuid
    Kalenderbereich:
      type: object
      description: Themenbereich des Kalenders.
      properties:
        schluessel:
          type: string
        name:
          type: string
        farbe:
          type:
          - string
          - 'null'
    Uebersicht:
      type: object
      description: Kennzahlen der Übersicht.
      properties:
        laufendeAblaeufe:
          type: integer
        offeneAufgaben:
          type: integer
        ueberfaellig:
          type: integer
        fehlgeschlageneAufrufe:
          type: integer
        naechsteTermine:
          type: array
          items:
            $ref: '#/components/schemas/Vorkommen'
    VorlageVoll: *id002
    LaufVoll: *id010
    EreignisVoll: *id004
    RolleVoll: *id005
    FunktionVoll: *id006
    QuelleVoll: *id007
    ModulVoll: *id008
webhooks:
  laufAbgeschlossen:
    post:
      summary: Ablauf abgeschlossen (z. B. für EduKSX-Staffing, Archiv).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lauf'
      responses:
        '204':
          description: Empfangen.
  vorgangAufrufen:
    post:
      summary: Aufruf eines Vorgangs an das anbietende Modul (Antwort sofort oder später über /v1/aufrufe/rueckmeldung).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aufruf'
      responses:
        '200':
          description: Sofort erledigt, Ergebnis im Body.
        '202':
          description: Angenommen, Rückmeldung folgt.
