# EduKSX-Flow – API-Beschreibung (OpenAPI 3.1)
# Stand 2026-11-20 · Status ENTWURF · Grundlage: Prototyp prototypen/ablaufplanung
# Konventionen: docs/umsetzung/README.md · Pfade ohne Modulpräfix (Namensraum beim Zusammenführen)
openapi: 3.1.0
info:
  title: EduKSX-Flow
  version: 0.1.0
  description: 'Ablaufplanung / Termine und ToDo: Ablaufvorlagen mit Schritten, die Vorgänge in anderen Modulen aufrufen (Vorgangsregister),
    laufende Abläufe mit Fristen ab Stichtag, Aufgaben je Rolle, Aufrufprotokoll, Funktionendiagramm und Jahreskalender mit
    Zeitregeln. Fristen, Status «bereit» und Kalendervorkommen berechnet der Motor.'
  contact:
    name: EduKSX
    url: https://github.com/MarkusKeller8200/EduKSX-Prototyp
  license:
    name: siehe Repository
    identifier: LicenseRef-EduKSX
servers:
- url: https://{mandant}.eduksx.ch/api
  variables:
    mandant:
      default: demo
  description: Beispiel – Namensraum je Modul setzt das Zusammenführen in EduKSX-Architektur.
security:
- ident:
  - flow:lesen
tags:
- name: Aufgaben
  description: Meine Aufgaben
- name: Abläufe
  description: Laufende Abläufe
- name: Vorlagen
  description: Ablaufvorlagen
- name: Register
  description: Vorgänge der Module
- name: Kalender
  description: Jahreskalender
- name: Stammdaten
  description: Rollen, Funktionendiagramm, Quellen
- name: Protokoll
  description: Aufrufprotokoll und Hinweise
paths:
  /v1/vorlagen:
    get:
      tags:
      - Vorlagen
      operationId: vorlageListe
      summary: Ablaufvorlagen auflisten
      security:
      - ident:
        - flow:lesen
      parameters:
      - $ref: '#/components/parameters/Seite'
      - $ref: '#/components/parameters/Anzahl'
      - name: gruppe
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: suche
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Liste der Ablaufvorlagen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  daten:
                    type: array
                    items:
                      $ref: '#/components/schemas/VorlageVoll'
                  seite:
                    type: integer
                  anzahl:
                    type: integer
                  total:
                    type: integer
                required:
                - daten
                - seite
                - anzahl
                - total
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
    post:
      tags:
      - Vorlagen
      operationId: vorlageAnlegen
      summary: Ablaufvorlage anlegen
      security:
      - ident:
        - flow:vorlagen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vorlage'
      responses:
        '201':
          description: Angelegt.
          headers:
            ETag: &id001
              description: Version des Datensatzes.
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema: &id002
                allOf:
                - $ref: '#/components/schemas/Vorlage'
                - $ref: '#/components/schemas/Protokoll'
        '400':
          $ref: '#/components/responses/Ungueltig'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '409':
          $ref: '#/components/responses/Konflikt'
  /v1/vorlagen/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Vorlagen
      operationId: vorlageLesen
      summary: Ablaufvorlage lesen
      security:
      - ident:
        - flow:lesen
      responses:
        '200':
          description: Ablaufvorlage
          headers: &id003
            ETag: *id001
          content:
            application/json:
              schema: *id002
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '404':
          $ref: '#/components/responses/NichtGefunden'
    patch:
      tags:
      - Vorlagen
      operationId: vorlageAendern
      summary: Ablaufvorlage ändern (JSON Merge Patch)
      security:
      - ident:
        - flow:vorlagen
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Vorlage'
      responses:
        '200':
          description: Geändert.
          headers: *id003
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/Ungueltig'
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '412':
          $ref: '#/components/responses/VersionVeraltet'
    delete:
      tags:
      - Vorlagen
      operationId: vorlageEntfernen
      summary: Ablaufvorlage entfernen (archivieren)
      security:
      - ident:
        - flow:vorlagen
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Entfernt bzw. archiviert.
        '401':
          $ref: '#/components/responses/NichtAngemeldet'
        '403':
          $ref: '#/components/responses/KeinRecht'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '412':
          $ref: '#/components/responses/VersionVeraltet'
